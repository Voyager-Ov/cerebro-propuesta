<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blobatar 3D ASCII // Prototipo 2: Colored ASCII + Hollow Eyes</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #000000; /* Fondo negro absoluto, sin aura */
      color: #F4F4F5;
      font-family: 'JetBrains Mono', 'Geist Mono', monospace, Courier;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Canvas donde se dibuja el ASCII coloreado directamente */
    #ascii-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      background: #000000;
    }

    /* HUD Superior */
    .hud-header {
      position: absolute;
      top: 20px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: auto;
    }

    .hud-badge {
      font-size: 11px;
      letter-spacing: 2px;
      background: rgba(9, 9, 11, 0.9);
      border: 1px solid #27272A;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(8px);
    }

    .proto-badge {
      color: #00FF66;
      font-weight: 700;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #00FF66;
      box-shadow: 0 0 10px #00FF66;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    /* HUD Inferior */
    .hud-footer {
      position: absolute;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
      pointer-events: auto;
      max-width: 720px;
      width: 92%;
    }

    /* Barra de Semilla / Blobatar */
    .seed-bar {
      display: flex;
      align-items: center;
      width: 100%;
      background: rgba(13, 13, 14, 0.9);
      border: 1px solid #27272A;
      backdrop-filter: blur(10px);
      padding: 4px;
    }

    .seed-bar span {
      font-size: 11px;
      color: #71717A;
      padding-left: 12px;
      padding-right: 6px;
      letter-spacing: 1px;
    }

    .seed-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #00F0FF;
      font-family: inherit;
      font-size: 13px;
      padding: 8px 6px;
      letter-spacing: 1px;
    }

    /* Botones de Control */
    .controls-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      background: rgba(9, 9, 11, 0.9);
      border: 1px solid #27272A;
      color: #A1A1AA;
      font-family: inherit;
      font-size: 11px;
      padding: 7px 12px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #18181B;
      color: #FFFFFF;
      border-color: #52525B;
    }

    .btn.active {
      background: #00F0FF;
      color: #000000;
      border-color: #00F0FF;
      font-weight: 700;
    }

    .btn-mic.active {
      background: #FF0055;
      color: #FFFFFF;
      border-color: #FF0055;
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.6);
    }

    .nav-switch {
      font-size: 10px;
      color: #71717A;
      text-decoration: none;
      padding: 4px 8px;
      border: 1px dashed #3F3F46;
      margin-left: 10px;
    }
    .nav-switch:hover {
      color: #FFFFFF;
      border-color: #A1A1AA;
    }
  </style>
  <script src="./three.min.js"></script>
</head>
<body>

  <!-- Canvas principal para renderizar los caracteres ASCII con color por caracter -->
  <canvas id="ascii-canvas"></canvas>

  <!-- HUD Superior -->
  <div class="hud-header">
    <div class="hud-badge">
      <div class="status-dot" id="state-dot"></div>
      <span id="state-label">PROTOTIPO 2 // COLORED ASCII + HOLLOW EYES</span>
      <a href="./index.html" class="nav-switch">VER PROTO 1 (MONO+AURA)</a>
    </div>
    <div class="hud-badge">
      <span class="proto-badge">BLOBATAR 3D ENGINE</span>
    </div>
  </div>

  <!-- HUD Inferior -->
  <div class="hud-footer">
    <div class="seed-bar">
      <span>BLOBATAR_SEED:</span>
      <input type="text" id="seed-input" class="seed-input" value="Satoshi-Blobatar-01" placeholder="Escribe un nombre para mutar el blob..." />
    </div>

    <div class="controls-row">
      <button class="btn active" id="btn-idle">IDLE [RESPIRAR]</button>
      <button class="btn btn-mic" id="btn-mic">🎙️ MIC EN VIVO</button>
      <button class="btn" id="btn-think">THINKING [MUTACIÓN SUAVE]</button>
      <button class="btn" id="btn-speak">SPEAKING [HABLA IA]</button>
      <button class="btn" id="btn-palette">COLOR ASCII: COBALT BLUE</button>
    </div>
  </div>

  <script>
    // ============================================================
    // 1. Simplex Noise 3D Implementation (Zero Dependencies)
    // ============================================================
    class SimplexNoise {
      constructor(seed = 0) {
        this.p = new Uint8Array(256);
        for (let i = 0; i < 256; i++) this.p[i] = i;
        let s = seed % 2147483647;
        for (let i = 255; i > 0; i--) {
          s = (s * 16807) % 2147483647;
          const j = s % (i + 1);
          const tmp = this.p[i];
          this.p[i] = this.p[j];
          this.p[j] = tmp;
        }
        this.perm = new Uint8Array(512);
        for (let i = 0; i < 512; i++) this.perm[i] = this.p[i & 255];
      }
      noise3D(x, y, z) {
        const F3 = 1.0 / 3.0, G3 = 1.0 / 6.0;
        let s = (x + y + z) * F3;
        let i = Math.floor(x + s), j = Math.floor(y + s), k = Math.floor(z + s);
        let t = (i + j + k) * G3;
        let X0 = i - t, Y0 = j - t, Z0 = k - t;
        let x0 = x - X0, y0 = y - Y0, z0 = z - Z0;
        let i1, j1, k1, i2, j2, k2;
        if (x0 >= y0) {
          if (y0 >= z0) { i1=1; j1=0; k1=0; i2=1; j2=1; k2=0; }
          else if (x0 >= z0) { i1=1; j1=0; k1=0; i2=1; j2=0; k2=1; }
          else { i1=0; j1=0; k1=1; i2=1; j2=0; k2=1; }
        } else {
          if (y0 < z0) { i1=0; j1=0; k1=1; i2=0; j2=1; k2=1; }
          else if (x0 < z0) { i1=0; j1=1; k1=0; i2=0; j2=1; k2=1; }
          else { i1=0; j1=1; k1=0; i2=1; j2=1; k2=0; }
        }
        let x1 = x0 - i1 + G3, y1 = y0 - j1 + G3, z1 = z0 - k1 + G3;
        let x2 = x0 - i2 + 2.0*G3, y2 = y0 - j2 + 2.0*G3, z2 = z0 - k2 + 2.0*G3;
        let x3 = x0 - 1.0 + 3.0*G3, y3 = y0 - 1.0 + 3.0*G3, z3 = z0 - 1.0 + 3.0*G3;
        let ii = i & 255, jj = j & 255, kk = k & 255;
        let n0 = 0, n1 = 0, n2 = 0, n3 = 0;
        let t0 = 0.6 - x0*x0 - y0*y0 - z0*z0;
        if (t0 > 0) { t0 *= t0; n0 = t0 * t0 * this.grad(this.perm[ii + this.perm[jj + this.perm[kk]]], x0, y0, z0); }
        let t1 = 0.6 - x1*x1 - y1*y1 - z1*z1;
        if (t1 > 0) { t1 *= t1; n1 = t1 * t1 * this.grad(this.perm[ii + i1 + this.perm[jj + j1 + this.perm[kk + k1]]], x1, y1, z1); }
        let t2 = 0.6 - x2*x2 - y2*y2 - z2*z2;
        if (t2 > 0) { t2 *= t2; n2 = t2 * t2 * this.grad(this.perm[ii + i2 + this.perm[jj + j2 + this.perm[kk + k2]]], x2, y2, z2); }
        let t3 = 0.6 - x3*x3 - y3*y3 - z3*z3;
        if (t3 > 0) { t3 *= t3; n3 = t3 * t3 * this.grad(this.perm[ii + 1 + this.perm[jj + 1 + this.perm[kk + 1]]], x3, y3, z3); }
        return 32.0 * (n0 + n1 + n2 + n3);
      }
      grad(hash, x, y, z) {
        let h = hash & 15;
        let u = h < 8 ? x : y;
        let v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
        return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
      }
    }

    // ============================================================
    // 2. Three.js 3D Offscreen Scene
    // ============================================================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 1000);
    camera.position.z = 210;

    // Icosaedro de alta subdivisión (Blobatar Mesh)
    const baseRadius = 55;
    const geometry = new THREE.IcosahedronGeometry(baseRadius, 5);
    const originalPositions = geometry.attributes.position.clone();

    // Material sombreado estándar para calcular gradientes de luz
    const material = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.35,
      metalness: 0.1,
      flatShading: false
    });

    const blobMesh = new THREE.Mesh(geometry, material);
    scene.add(blobMesh);

    // Luces direccionadas para generar volumen
    const ambientLight = new THREE.AmbientLight(0x222222);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
    keyLight.position.set(80, 100, 120);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x4488ff, 0.7);
    fillLight.position.set(-100, -60, -40);
    scene.add(fillLight);

    // ============================================================
    // 3. Colored ASCII 2D Canvas Engine (Direct Font Coloring)
    // ============================================================
    const canvas = document.getElementById('ascii-canvas');
    const ctx = canvas.getContext('2d');

    // Resolución interna del grid ASCII
    const gridCols = 130;
    const gridRows = 68;

    const offRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    offRenderer.setSize(gridCols, gridRows);

    const pixelBuffer = new Uint8Array(gridCols * gridRows * 4);
    const asciiChars = "  .:-=+*#%@";
    const charCount = asciiChars.length;

    // Paletas de Color directas sobre los caracteres ASCII
    const palettes = [
      { name: "COBALT BLUE", r: 30, g: 120, b: 255, highlight: [180, 220, 255] },
      { name: "CYBER CYAN", r: 0, g: 240, b: 255, highlight: [220, 255, 255] },
      { name: "NEON PURPLE", r: 180, g: 50, b: 255, highlight: [240, 200, 255] },
      { name: "TOXIC EMERALD", r: 0, g: 255, b: 130, highlight: [200, 255, 220] },
      { name: "SOLAR AMBER", r: 255, g: 130, b: 20, highlight: [255, 230, 180] },
      { name: "MONO WHITE", r: 210, g: 210, b: 220, highlight: [255, 255, 255] }
    ];
    let currentPaletteIdx = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ------------------------------------------------------------
    // Proyección de Ojos Hollow (Dos Huecos de Blobatar)
    // ------------------------------------------------------------
    let leftEyeCol = -100, leftEyeRow = -100;
    let rightEyeCol = -100, rightEyeRow = -100;
    const eyeHoleRadius = 4.0; // Radio del hueco negro en celdas ASCII

    function updateEyeProjections() {
      // Posición 3D de los ojos en la superficie frontal del orbe
      const eyeZ = baseRadius * 0.88;
      const eyeSpread = 16.0;
      const eyeElev = 8.0;

      // Desplazamiento reactivo de los ojos hacia el mouse con alta sensibilidad
      const eyeMoveX = smoothEyeX * 32.0;
      const eyeMoveY = smoothEyeY * 26.0;

      const vL = new THREE.Vector3(-eyeSpread + eyeMoveX, eyeElev + eyeMoveY, eyeZ);
      const vR = new THREE.Vector3(eyeSpread + eyeMoveX, eyeElev + eyeMoveY, eyeZ);

      // Proyección a coordenadas de la grilla ASCII
      vL.project(camera);
      leftEyeCol = (vL.x * 0.5 + 0.5) * gridCols;
      leftEyeRow = (-vL.y * 0.5 + 0.5) * gridRows;

      vR.project(camera);
      rightEyeCol = (vR.x * 0.5 + 0.5) * gridCols;
      rightEyeRow = (-vR.y * 0.5 + 0.5) * gridRows;
    }

    function renderColoredAscii() {
      updateEyeProjections();

      // 1. Renderizar Three.js al buffer offscreen
      offRenderer.render(scene, camera);
      const gl = offRenderer.getContext();
      gl.readPixels(0, 0, gridCols, gridRows, gl.RGBA, gl.UNSIGNED_BYTE, pixelBuffer);

      // 2. Limpiar Canvas con negro puro (sin aura)
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cellWidth = canvas.width / gridCols;
      const cellHeight = canvas.height / gridRows;

      ctx.font = `bold ${Math.max(10, Math.floor(cellHeight * 1.05))}px 'JetBrains Mono', Courier, monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const pal = palettes[currentPaletteIdx];

      // 3. Dibujar cada caracter con su color directo
      for (let y = 0; y < gridRows; y++) {
        const bufferY = gridRows - 1 - y;
        for (let x = 0; x < gridCols; x++) {
          const idx = (bufferY * gridCols + x) * 4;
          const r = pixelBuffer[idx];
          const g = pixelBuffer[idx + 1];
          const b = pixelBuffer[idx + 2];
          const a = pixelBuffer[idx + 3];

          if (a < 30) continue;

          // Verificación de los Dos Huecos de los Ojos (Blobatar Eyes)
          const distL = Math.hypot(x - leftEyeCol, (y - leftEyeRow) * 1.35);
          const distR = Math.hypot(x - rightEyeCol, (y - rightEyeRow) * 1.35);

          if (distL < eyeHoleRadius || distR < eyeHoleRadius) {
            // Hueco vacío negro puro (los ojos de Blobatar)
            continue;
          }

          // Borde de la cuenca del ojo para dar definición visual
          const isEyeRim = (distL < eyeHoleRadius + 1.2 || distR < eyeHoleRadius + 1.2);

          const brightness = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
          const charIdx = Math.floor(brightness * (charCount - 1));
          let char = isEyeRim ? ":" : asciiChars[charIdx];

          if (char === ' ') continue;

          // Color directo del caracter: modulado por luminancia
          let charR, charG, charB;
          if (isEyeRim) {
            charR = Math.floor(pal.r * 0.4);
            charG = Math.floor(pal.g * 0.4);
            charB = Math.floor(pal.b * 0.4);
          } else if (brightness > 0.82) {
            // Zonas de luz alta: brillo blanco/destello
            charR = pal.highlight[0];
            charG = pal.highlight[1];
            charB = pal.highlight[2];
          } else {
            // Zonas tonales intermedias: color de la paleta saturado
            const factor = Math.max(0.35, brightness);
            charR = Math.floor(pal.r * factor);
            charG = Math.floor(pal.g * factor);
            charB = Math.floor(pal.b * factor);
          }

          ctx.fillStyle = `rgb(${charR}, ${charG}, ${charB})`;
          ctx.fillText(char, x * cellWidth + cellWidth / 2, y * cellHeight + cellHeight / 2);
        }
      }
    }

    // ============================================================
    // 4. Blobatar Shape & Hollow Eyes (Dos Huecos que Siguen al Mouse)
    // ============================================================
    function hashStringToSeed(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash);
    }

    // Sistema de Morfología Prolongada y Suave
    let currentSeedHash = hashStringToSeed("Satoshi-Blobatar-01");
    let targetSeedHash = currentSeedHash;
    let simplexCurrent = new SimplexNoise(currentSeedHash);
    let simplexTarget = new SimplexNoise(targetSeedHash);
    let morphTransitionProgress = 1.0; // 0.0 a 1.0

    // Parámetros de ruido orgánico estilo Blobatar (baja frecuencia, formas redondeadas)
    let baseNoiseFreq = 0.015;
    let baseNoiseAmp = 14.0;
    let currentAmp = baseNoiseAmp;
    let targetAmp = baseNoiseAmp;

    function setSeed(newSeedStr) {
      targetSeedHash = hashStringToSeed(newSeedStr.trim() || "default");
      simplexTarget = new SimplexNoise(targetSeedHash);
      morphTransitionProgress = 0.0; // Inicia transición prolongada suave
    }

    document.getElementById('seed-input').addEventListener('input', (e) => {
      setSeed(e.target.value);
    });

    // Tracking del Mouse con Mayor Intensidad para los Ojos
    let mouseNormX = 0, mouseNormY = 0;
    let smoothEyeX = 0, smoothEyeY = 0;

    window.addEventListener('mousemove', (e) => {
      mouseNormX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseNormY = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    // ============================================================
    // 5. Audio Reactive & Voice Modes
    // ============================================================
    let audioContext = null;
    let analyser = null;
    let micStream = null;
    let isMicActive = false;
    let audioEnergy = 0;

    const btnMic = document.getElementById('btn-mic');
    async function toggleMicrophone() {
      if (isMicActive) {
        if (micStream) micStream.getTracks().forEach(t => t.stop());
        isMicActive = false;
        btnMic.classList.remove('active');
        btnMic.textContent = "🎙️ MIC EN VIVO";
        setVoiceState("IDLE");
      } else {
        try {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const source = audioContext.createMediaStreamSource(micStream);
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 64;
          source.connect(analyser);

          isMicActive = true;
          btnMic.classList.add('active');
          btnMic.textContent = "🔴 MIC EN VIVO";
          setVoiceState("LISTENING");
        } catch (err) {
          alert("Micrófono no disponible; usando simulador procedural.");
          isMicActive = false;
        }
      }
    }
    btnMic.addEventListener('click', toggleMicrophone);

    let currentMode = "IDLE";
    const stateLabel = document.getElementById('state-label');
    const stateDot = document.getElementById('state-dot');

    function setVoiceState(mode) {
      currentMode = mode;
      document.querySelectorAll('.controls-row .btn:not(#btn-palette):not(#btn-mic)').forEach(b => b.classList.remove('active'));

      if (mode === "IDLE") {
        document.getElementById('btn-idle').classList.add('active');
        stateLabel.textContent = "PROTOTIPO 2 // IDLE (RESPIRACIÓN ORGÁNICA)";
        stateDot.style.backgroundColor = "#00FF66";
        targetAmp = 16.0;
      } else if (mode === "LISTENING") {
        stateLabel.textContent = "PROTOTIPO 2 // LISTENING (REACTIVO A VOZ)";
        stateDot.style.backgroundColor = "#00F0FF";
        targetAmp = 24.0;
      } else if (mode === "THINKING") {
        document.getElementById('btn-think').classList.add('active');
        stateLabel.textContent = "PROTOTIPO 2 // THINKING (MUTACIÓN SUAVE BLOBATAR)";
        stateDot.style.backgroundColor = "#B000FF";
        targetAmp = 28.0;
        // Mutar hacia una nueva semilla matemática suavemente
        setSeed("ThinkingMutation-" + Math.floor(Math.random() * 1000));
      } else if (mode === "SPEAKING") {
        document.getElementById('btn-speak').classList.add('active');
        stateLabel.textContent = "PROTOTIPO 2 // SPEAKING (RESPUESTA DE IA)";
        stateDot.style.backgroundColor = "#00FF66";
        targetAmp = 22.0;
      }
    }

    document.getElementById('btn-idle').addEventListener('click', () => setVoiceState("IDLE"));
    document.getElementById('btn-think').addEventListener('click', () => setVoiceState("THINKING"));
    document.getElementById('btn-speak').addEventListener('click', () => setVoiceState("SPEAKING"));

    document.getElementById('btn-palette').addEventListener('click', () => {
      currentPaletteIdx = (currentPaletteIdx + 1) % palettes.length;
      document.getElementById('btn-palette').textContent = "COLOR ASCII: " + palettes[currentPaletteIdx].name;
    });

    // ============================================================
    // 6. Main Animation Loop (Geometry Deformation + Eye Voids)
    // ============================================================
    const clock = new THREE.Clock();
    const dataArray = new Uint8Array(32);

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Transición prolongada y suave de forma (Morphing Transition Lerp)
      if (morphTransitionProgress < 1.0) {
        morphTransitionProgress += delta * 0.75; // ~1.3 segundos de duración de transformación
        if (morphTransitionProgress >= 1.0) {
          morphTransitionProgress = 1.0;
          currentSeedHash = targetSeedHash;
          simplexCurrent = simplexTarget;
        }
      }

      // Suavizado de la amplitud
      currentAmp += (targetAmp - currentAmp) * delta * 2.0;

      // Audio análisis
      if (isMicActive && analyser) {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        audioEnergy = (sum / dataArray.length) / 255; // 0 a 1
      } else if (currentMode === "SPEAKING") {
        audioEnergy = (Math.sin(time * 5.0) * 0.35 + 0.45) + (Math.sin(time * 11.0) * 0.15);
      } else if (currentMode === "THINKING") {
        audioEnergy = (Math.sin(time * 7.0) * 0.2 + 0.25);
      } else {
        audioEnergy = 0;
      }

      // ------------------------------------------------------------
      // Posicionamiento de los Ojos (Dos Huecos que miran intensamente al mouse)
      // ------------------------------------------------------------
      // Suavizado inercial del movimiento de ojos hacia el mouse
      smoothEyeX += (mouseNormX * 0.42 - smoothEyeX) * (delta * 6.0);
      smoothEyeY += (mouseNormY * 0.38 - smoothEyeY) * (delta * 6.0);

      // Posición central de los dos ojos en espacio normalizado (mirando hacia Z+)
      // El ojo izquierdo y derecho tienen un offset base y reaccionan al mouse
      const leftEyeTarget = new THREE.Vector3(-0.28 + smoothEyeX, 0.14 + smoothEyeY, 0.90).normalize();
      const rightEyeTarget = new THREE.Vector3(0.28 + smoothEyeX, 0.14 + smoothEyeY, 0.90).normalize();
      const eyeRadius = 0.22; // Radio de apertura del hueco del ojo
      const eyeDepth = 32.0;  // Profundidad de hundimiento

      // Deformación de vértices (Simplex Noise + Inset de Ojos)
      const posAttr = geometry.attributes.position;
      const origAttr = originalPositions;
      const count = posAttr.count;

      // Curva de interpolación suave entre el ruido anterior y el nuevo
      const easeT = morphTransitionProgress * morphTransitionProgress * (3 - 2 * morphTransitionProgress);

      for (let i = 0; i < count; i++) {
        const ox = origAttr.getX(i);
        const oy = origAttr.getY(i);
        const oz = origAttr.getZ(i);

        const len = Math.sqrt(ox * ox + oy * oy + oz * oz);
        const nx = ox / len;
        const ny = oy / len;
        const nz = oz / len;

        // 1. Ruido procedural orgánico Blobatar (blend suave entre semillas)
        const tCoord = time * 0.6;
        const nA = simplexCurrent.noise3D(ox * baseNoiseFreq + tCoord * 0.3, oy * baseNoiseFreq + tCoord * 0.3, oz * baseNoiseFreq + tCoord * 0.3);
        const nB = simplexTarget.noise3D(ox * baseNoiseFreq + tCoord * 0.3, oy * baseNoiseFreq + tCoord * 0.3, oz * baseNoiseFreq + tCoord * 0.3);
        const blendedNoise = (1.0 - easeT) * nA + easeT * nB;

        // 2. Modulación por voz (dilatación de volumen)
        let displacement = len + (blendedNoise * currentAmp) + (audioEnergy * 16.0);

        // 3. Deformación de "Hueco de Ojo" (Cavidades oculares)
        // Calculamos la distancia angular/cartesiana del vértice a cada ojo
        const dLeft = Math.sqrt((nx - leftEyeTarget.x)**2 + (ny - leftEyeTarget.y)**2 + (nz - leftEyeTarget.z)**2);
        const dRight = Math.sqrt((nx - rightEyeTarget.x)**2 + (ny - rightEyeTarget.y)**2 + (nz - rightEyeTarget.z)**2);

        if (dLeft < eyeRadius) {
          const depthFactor = (1.0 - dLeft / eyeRadius);
          displacement -= (depthFactor * depthFactor) * eyeDepth;
        }
        if (dRight < eyeRadius) {
          const depthFactor = (1.0 - dRight / eyeRadius);
          displacement -= (depthFactor * depthFactor) * eyeDepth;
        }

        posAttr.setXYZ(i, nx * displacement, ny * displacement, nz * displacement);
      }

      posAttr.needsUpdate = true;
      geometry.computeVertexNormals();

      // Suave balanceo del cuerpo del orbe
      blobMesh.rotation.y = smoothEyeX * 0.25;
      blobMesh.rotation.x = -smoothEyeY * 0.25;

      // Renderizar el lienzo de caracteres coloreados
      renderColoredAscii();
    }

    // Soporte para parámetros URL (modo, seed, paleta)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('seed')) setSeed(urlParams.get('seed'));
    if (urlParams.has('palette')) {
      currentPaletteIdx = parseInt(urlParams.get('palette')) % palettes.length;
      document.getElementById('btn-palette').textContent = "COLOR ASCII: " + palettes[currentPaletteIdx].name;
    }
    if (urlParams.has('mode')) setVoiceState(urlParams.get('mode').toUpperCase());

    animate();
  </script>
</body>
</html>
