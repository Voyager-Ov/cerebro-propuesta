<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blobatar ASCII // Prototipo 4 (Bencho Minimalist Style)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #000000;
      color: #EDEDED;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    /* Canvas ASCII interactivo a pantalla completa */
    #ascii-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      background: #000000;
      cursor: default;
      transition: cursor 0.15s;
    }

    #ascii-canvas.hovered {
      cursor: pointer;
    }

    /* ------------------------------------------------------------- */
    /* UI Estilo Bencho.dev: Minimalista, Flotante, Píldoras Vidriadas */
    /* ------------------------------------------------------------- */

    /* Header sutil superior */
    .top-bar {
      position: absolute;
      top: 24px;
      left: 28px;
      right: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: auto;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.2px;
      color: #A1A1AA;
    }

    .brand-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00FF66;
      box-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
      transition: background 0.3s, box-shadow 0.3s;
    }

    .brand-title b {
      color: #FFFFFF;
      font-weight: 600;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 12px;
      height: 32px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #A1A1AA;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .icon-pill:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.16);
      color: #FFFFFF;
    }

    .palette-swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #0088FF;
      box-shadow: 0 0 6px rgba(0, 136, 255, 0.5);
    }

    /* Dock Flotante Inferior (Firma Bencho) */
    .dock-container {
      position: absolute;
      bottom: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
      pointer-events: auto;
      max-width: 660px;
      width: 90%;
    }

    .dock {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 6px;
      background: rgba(14, 14, 16, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 9999px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.03);
    }

    /* Píldora de Entrada de Semilla */
    .seed-capsule {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      height: 36px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: border-color 0.2s, background 0.2s;
    }

    .seed-capsule:focus-within {
      border-color: rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.06);
    }

    .seed-icon {
      width: 13px;
      height: 13px;
      stroke: #71717A;
    }

    .seed-input {
      background: transparent;
      border: none;
      outline: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      color: #00F0FF;
      width: 130px;
      letter-spacing: -0.2px;
    }

    .divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 2px;
    }

    /* Segmented Control de Estados */
    .segmented-group {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .pill-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 13px;
      height: 34px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      color: #A1A1AA;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pill-btn svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
    }

    .pill-btn:hover {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.06);
    }

    .pill-btn.active {
      color: #000000;
      background: #FFFFFF;
      font-weight: 600;
      box-shadow: 0 2px 10px rgba(255, 255, 255, 0.25);
    }

    .pill-btn.active svg {
      stroke: #000000;
    }

    .pill-mic.active {
      background: #FF0055;
      color: #FFFFFF;
      box-shadow: 0 2px 12px rgba(255, 0, 85, 0.5);
    }

    .pill-mic.active svg {
      stroke: #FFFFFF;
    }

    /* Micro-texto de ayuda estilo Bencho */
    .caption-hint {
      font-size: 11px;
      color: #52525B;
      letter-spacing: -0.1px;
    }
  </style>
  <script src="./three.min.js"></script>
</head>
<body>

  <!-- Canvas donde se dibuja el ASCII Coloreado Directo (Sin Aura) -->

  <!-- Barra Superior Minimalista -->
  <header class="top-bar">
    <div class="brand-mark">
      <div class="brand-dot" id="brand-dot"></div>

  <!-- Dock Flotante Inferior -->
  <div class="dock-container">
    <div class="dock">
      
      <!-- Entrada de Semilla -->
      <div class="seed-capsule">
        <svg class="seed-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <input type="text" id="seed-input" class="seed-input" value="Bencho-Craft-04" placeholder="Seed..." />
      </div>

      <div class="divider"></div>

      <!-- Segmented Control de Estados -->
      <div class="segmented-group">
        <button class="pill-btn active" id="btn-idle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
          </svg>
          <span>Idle</span>
        </button>

        <button class="pill-btn pill-mic" id="btn-mic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
          <span id="mic-text">Voice</span>
        </button>

        <button class="pill-btn" id="btn-think">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"></path>
          </svg>
          <span>Think</span>
        </button>

        <button class="pill-btn" id="btn-speak">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <span>Speak</span>
        </button>
      </div>

    </div>
    
    <div class="caption-hint">Hover to squish · Click to blink · Drag to rotate</div>
  </div>

  <script>
    // ============================================================
    // 1. Simplex Noise 3D Engine
    // ============================================================
    class SimplexNoise {
      constructor(seed = 0) {
        this.p = new Uint8Array(256);
        for (let i = 0; i < 256; i++) this.p[i] = i;
        let s = seed % 2147483647;
        for (let i = 255; i > 0; i--) {
          s = (s * 16807) % 2147483647;
          const j = s % (i + 1);
          const tmp = this.p[i];
          this.p[i] = this.p[j];
          this.p[j] = tmp;
        }
        this.perm = new Uint8Array(512);
        for (let i = 0; i < 512; i++) this.perm[i] = this.p[i & 255];
      }
      noise3D(x, y, z) {
        const F3 = 1.0 / 3.0, G3 = 1.0 / 6.0;
        let s = (x + y + z) * F3;
        let i = Math.floor(x + s), j = Math.floor(y + s), k = Math.floor(z + s);
        let t = (i + j + k) * G3;
        let X0 = i - t, Y0 = j - t, Z0 = k - t;
        let x0 = x - X0, y0 = y - Y0, z0 = z - Z0;
        let i1, j1, k1, i2, j2, k2;
        if (x0 >= y0) {
          if (y0 >= z0) { i1=1; j1=0; k1=0; i2=1; j2=1; k2=0; }
          else if (x0 >= z0) { i1=1; j1=0; k1=0; i2=1; j2=0; k2=1; }
          else { i1=0; j1=0; k1=1; i2=1; j2=0; k2=1; }
        } else {
          if (y0 < z0) { i1=0; j1=0; k1=1; i2=0; j2=1; k2=1; }
          else if (x0 < z0) { i1=0; j1=1; k1=0; i2=0; j2=1; k2=1; }
          else { i1=0; j1=1; k1=0; i2=1; j2=1; k2=0; }
        }
        let x1 = x0 - i1 + G3, y1 = y0 - j1 + G3, z1 = z0 - k1 + G3;
        let x2 = x0 - i2 + 2.0*G3, y2 = y0 - j2 + 2.0*G3, z2 = z0 - k2 + 2.0*G3;
        let x3 = x0 - 1.0 + 3.0*G3, y3 = y0 - 1.0 + 3.0*G3, z3 = z0 - 1.0 + 3.0*G3;
        let ii = i & 255, jj = j & 255, kk = k & 255;
        let n0 = 0, n1 = 0, n2 = 0, n3 = 0;
        let t0 = 0.6 - x0*x0 - y0*y0 - z0*z0;
        if (t0 > 0) { t0 *= t0; n0 = t0 * t0 * this.grad(this.perm[ii + this.perm[jj + this.perm[kk]]], x0, y0, z0); }
        let t1 = 0.6 - x1*x1 - y1*y1 - z1*z1;
        if (t1 > 0) { t1 *= t1; n1 = t1 * t1 * this.grad(this.perm[ii + i1 + this.perm[jj + j1 + this.perm[kk + k1]]], x1, y1, z1); }
        let t2 = 0.6 - x2*x2 - y2*y2 - z2*z2;
        if (t2 > 0) { t2 *= t2; n2 = t2 * t2 * this.grad(this.perm[ii + i2 + this.perm[jj + j2 + this.perm[kk + k2]]], x2, y2, z2); }
        let t3 = 0.6 - x3*x3 - y3*y3 - z3*z3;
        if (t3 > 0) { t3 *= t3; n3 = t3 * t3 * this.grad(this.perm[ii + 1 + this.perm[jj + 1 + this.perm[kk + 1]]], x3, y3, z3); }
        return 32.0 * (n0 + n1 + n2 + n3);
      }
      grad(hash, x, y, z) {
        let h = hash & 15;
        let u = h < 8 ? x : y;
        let v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
        return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
      }
    }

    // ============================================================
    // 2. Three.js 3D Offscreen Setup
    // ============================================================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 1000);
    camera.position.z = 210;

    const baseRadius = 55;
    const geometry = new THREE.IcosahedronGeometry(baseRadius, 5);
    const originalPositions = geometry.attributes.position.clone();

    const material = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.35,
      metalness: 0.1,
      flatShading: false
    });

    const blobMesh = new THREE.Mesh(geometry, material);
    scene.add(blobMesh);

    const ambientLight = new THREE.AmbientLight(0x222222);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
    keyLight.position.set(80, 100, 120);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x4488ff, 0.7);
    fillLight.position.set(-100, -60, -40);
    scene.add(fillLight);

    // ============================================================
    // 3. Colored ASCII Canvas Engine (No Blurry Aura)
    // ============================================================
    const canvas = document.getElementById('ascii-canvas');
    const ctx = canvas.getContext('2d');

    const gridCols = 130;
    const gridRows = 68;

    const offRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    offRenderer.setSize(gridCols, gridRows);

    const pixelBuffer = new Uint8Array(gridCols * gridRows * 4);
    const asciiChars = "  .:-=+*#%@";
    const charCount = asciiChars.length;

    const palettes = [
      { name: "Cobalt Blue", hex: "#0088FF", r: 30, g: 120, b: 255, highlight: [180, 220, 255] },
      { name: "Cyber Cyan", hex: "#00F0FF", r: 0, g: 240, b: 255, highlight: [220, 255, 255] },
      { name: "Neon Purple", hex: "#B000FF", r: 180, g: 50, b: 255, highlight: [240, 200, 255] },
      { name: "Toxic Mint", hex: "#00FF88", r: 0, g: 255, b: 130, highlight: [200, 255, 220] },
      { name: "Solar Amber", hex: "#FF8800", r: 255, g: 130, b: 20, highlight: [255, 230, 180] },
      { name: "Monochrome", hex: "#FFFFFF", r: 210, g: 210, b: 220, highlight: [255, 255, 255] }
    ];
    let currentPaletteIdx = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ============================================================
    // 4. Spring-Damper Physics & Interactive Hover/Click
    // ============================================================
    let squishScaleY = 1.0;
    let squishScaleXZ = 1.0;
    let squishVelocity = 0.0;
    const springStiffness = 180.0;
    const springDamping = 12.0;

    let isHovered = false;
    let wasHovered = false;

    let isBlinking = false;
    let blinkProgress = 1.0;
    let blinkDuration = 0.22;
    let blinkTimer = 0.0;

    let clickRippleTime = 999.0;

    // Ojos Hollow de Blobatar
    let leftEyeCol = -100, leftEyeRow = -100;
    let rightEyeCol = -100, rightEyeRow = -100;
    const eyeHoleRadius = 4.0;

    function updateEyeProjections() {
      const eyeZ = baseRadius * 0.88;
      const eyeSpread = 16.0;
      const eyeElev = 8.0 * squishScaleY;

      const eyeMoveX = smoothEyeX * 32.0;
      const eyeMoveY = smoothEyeY * 26.0;

      const vL = new THREE.Vector3(-eyeSpread + eyeMoveX, eyeElev + eyeMoveY, eyeZ);
      const vR = new THREE.Vector3(eyeSpread + eyeMoveX, eyeElev + eyeMoveY, eyeZ);

      vL.project(camera);
      leftEyeCol = (vL.x * 0.5 + 0.5) * gridCols;
      leftEyeRow = (-vL.y * 0.5 + 0.5) * gridRows;

      vR.project(camera);
      rightEyeCol = (vR.x * 0.5 + 0.5) * gridCols;
      rightEyeRow = (-vR.y * 0.5 + 0.5) * gridRows;
    }

    function renderColoredAscii() {
      updateEyeProjections();

      offRenderer.render(scene, camera);
      const gl = offRenderer.getContext();
      gl.readPixels(0, 0, gridCols, gridRows, gl.RGBA, gl.UNSIGNED_BYTE, pixelBuffer);

      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cellWidth = canvas.width / gridCols;
      const cellHeight = canvas.height / gridRows;

      ctx.font = `bold ${Math.max(10, Math.floor(cellHeight * 1.05))}px 'JetBrains Mono', Courier, monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const pal = palettes[currentPaletteIdx];

      for (let y = 0; y < gridRows; y++) {
        const bufferY = gridRows - 1 - y;
        for (let x = 0; x < gridCols; x++) {
          const idx = (bufferY * gridCols + x) * 4;
          const r = pixelBuffer[idx];
          const g = pixelBuffer[idx + 1];
          const b = pixelBuffer[idx + 2];
          const a = pixelBuffer[idx + 3];

          if (a < 30) continue;

          // Dos huecos de ojos
          const dxL = x - leftEyeCol;
          const dyL = (y - leftEyeRow) / Math.max(0.15, blinkProgress);
          const distL = Math.hypot(dxL, dyL * 1.35);

          const dxR = x - rightEyeCol;
          const dyR = (y - rightEyeRow) / Math.max(0.15, blinkProgress);
          const distR = Math.hypot(dxR, dyR * 1.35);

          if (blinkProgress < 0.25) {
            if (Math.abs(y - Math.round(leftEyeRow)) <= 0 && Math.abs(dxL) < eyeHoleRadius * 1.2) {
              ctx.fillStyle = `rgb(${pal.highlight[0]}, ${pal.highlight[1]}, ${pal.highlight[2]})`;
              ctx.fillText("-", x * cellWidth + cellWidth / 2, y * cellHeight + cellHeight / 2);
              continue;
            }
            if (Math.abs(y - Math.round(rightEyeRow)) <= 0 && Math.abs(dxR) < eyeHoleRadius * 1.2) {
              ctx.fillStyle = `rgb(${pal.highlight[0]}, ${pal.highlight[1]}, ${pal.highlight[2]})`;
              ctx.fillText("-", x * cellWidth + cellWidth / 2, y * cellHeight + cellHeight / 2);
              continue;
            }
          }

          if (distL < eyeHoleRadius || distR < eyeHoleRadius) {
            continue; // Hueco del ojo vacío (negro)
          }

          const isEyeRim = (distL < eyeHoleRadius + 1.2 || distR < eyeHoleRadius + 1.2);
          const brightness = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
          const charIdx = Math.floor(brightness * (charCount - 1));
          let char = isEyeRim ? ":" : asciiChars[charIdx];

          if (char === ' ') continue;

          let charR, charG, charB;
          if (isEyeRim) {
            charR = Math.floor(pal.r * 0.45);
            charG = Math.floor(pal.g * 0.45);
            charB = Math.floor(pal.b * 0.45);
          } else if (brightness > 0.82) {
            charR = pal.highlight[0];
            charG = pal.highlight[1];
            charB = pal.highlight[2];
          } else {
            const factor = Math.max(0.35, brightness);
            charR = Math.floor(pal.r * factor);
            charG = Math.floor(pal.g * factor);
            charB = Math.floor(pal.b * factor);
          }

          if (clickRippleTime < 0.6) {
            const cellDist = Math.hypot(x - gridCols / 2, y - gridRows / 2);
            const waveFront = clickRippleTime * 70.0;
            if (Math.abs(cellDist - waveFront) < 3.5) {
              charR = Math.min(255, charR + 120);
              charG = Math.min(255, charG + 120);
              charB = Math.min(255, charB + 120);
              char = "@";
            }
          }

          ctx.fillStyle = `rgb(${charR}, ${charG}, ${charB})`;
          ctx.fillText(char, x * cellWidth + cellWidth / 2, y * cellHeight + cellHeight / 2);
        }
      }
    }

    // ============================================================
    // 5. Interacción del Cursor
    // ============================================================
    let mouseNormX = 0, mouseNormY = 0;
    let smoothEyeX = 0, smoothEyeY = 0;
    let mousePixelX = window.innerWidth / 2, mousePixelY = window.innerHeight / 2;

    window.addEventListener('mousemove', (e) => {
      mousePixelX = e.clientX;
      mousePixelY = e.clientY;
      mouseNormX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseNormY = -(e.clientY / window.innerHeight) * 2 + 1;

      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const distFromCenter = Math.hypot(mousePixelX - centerX, mousePixelY - centerY);
      const orbRadiusPixels = Math.min(window.innerWidth, window.innerHeight) * 0.28;

      isHovered = distFromCenter < orbRadiusPixels;

      if (isHovered && !wasHovered) {
        squishVelocity -= 0.45;
        canvas.classList.add('hovered');
      } else if (!isHovered && wasHovered) {
        squishVelocity += 0.25;
        canvas.classList.remove('hovered');
      }
      wasHovered = isHovered;
    });

    function triggerClickReaction() {
      isBlinking = true;
      blinkTimer = 0.0;
      squishVelocity -= 0.85;
      clickRippleTime = 0.0;
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.top-bar') || e.target.closest('.dock-container')) return;
      triggerClickReaction();
    });

    // ============================================================
    // 6. Semilla y Morfología Prolongada
    // ============================================================
    function hashStringToSeed(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash);
    }

    let currentSeedHash = hashStringToSeed("Bencho-Craft-04");
    let targetSeedHash = currentSeedHash;
    let simplexCurrent = new SimplexNoise(currentSeedHash);
    let simplexTarget = new SimplexNoise(targetSeedHash);
    let morphTransitionProgress = 1.0;

    let baseNoiseFreq = 0.015;
    let baseNoiseAmp = 14.0;
    let currentAmp = baseNoiseAmp;
    let targetAmp = baseNoiseAmp;

    function setSeed(newSeedStr) {
      targetSeedHash = hashStringToSeed(newSeedStr.trim() || "default");
      simplexTarget = new SimplexNoise(targetSeedHash);
      morphTransitionProgress = 0.0;
    }

    document.getElementById('seed-input').addEventListener('input', (e) => setSeed(e.target.value));

    // ============================================================
    // 7. Modos de Voz y Audio
    // ============================================================
    let audioContext = null;
    let analyser = null;
    let micStream = null;
    let isMicActive = false;
    let audioEnergy = 0;

    const btnMic = document.getElementById('btn-mic');
    async function toggleMicrophone() {
      if (isMicActive) {
        if (micStream) micStream.getTracks().forEach(t => t.stop());
        isMicActive = false;
        btnMic.classList.remove('active');
        document.getElementById('mic-text').textContent = "Voice";
        setVoiceState("IDLE");
      } else {
        try {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const source = audioContext.createMediaStreamSource(micStream);
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 64;
          source.connect(analyser);

          isMicActive = true;
          btnMic.classList.add('active');
          document.getElementById('mic-text').textContent = "Live";
          setVoiceState("LISTENING");
        } catch (err) {
          alert("Micrófono no disponible; usando simulador procedural.");
          isMicActive = false;
        }
      }
    }
    btnMic.addEventListener('click', toggleMicrophone);

    let currentMode = "IDLE";
    const brandDot = document.getElementById('brand-dot');

    function setVoiceState(mode) {
      currentMode = mode;
      document.querySelectorAll('.segmented-group .pill-btn:not(#btn-mic)').forEach(b => b.classList.remove('active'));

      if (mode === "IDLE") {
        document.getElementById('btn-idle').classList.add('active');
        brandDot.style.background = "#00FF66";
        brandDot.style.boxShadow = "0 0 8px rgba(0, 255, 102, 0.6)";
        targetAmp = 15.0;
      } else if (mode === "LISTENING") {
        brandDot.style.background = "#00F0FF";
        brandDot.style.boxShadow = "0 0 8px rgba(0, 240, 255, 0.6)";
        targetAmp = 22.0;
      } else if (mode === "THINKING") {
        document.getElementById('btn-think').classList.add('active');
        brandDot.style.background = "#B000FF";
        brandDot.style.boxShadow = "0 0 8px rgba(176, 0, 255, 0.6)";
        targetAmp = 26.0;
        setSeed("ThinkingMutation-" + Math.floor(Math.random() * 1000));
        triggerClickReaction();
      } else if (mode === "SPEAKING") {
        document.getElementById('btn-speak').classList.add('active');
        brandDot.style.background = "#00FF66";
        brandDot.style.boxShadow = "0 0 8px rgba(0, 255, 102, 0.6)";
        targetAmp = 20.0;
      }
    }

    document.getElementById('btn-idle').addEventListener('click', () => setVoiceState("IDLE"));
    document.getElementById('btn-think').addEventListener('click', () => setVoiceState("THINKING"));
    document.getElementById('btn-speak').addEventListener('click', () => setVoiceState("SPEAKING"));

    const paletteSwatch = document.getElementById('palette-swatch');
    const paletteName = document.getElementById('palette-name');

    document.getElementById('btn-palette').addEventListener('click', () => {
      currentPaletteIdx = (currentPaletteIdx + 1) % palettes.length;
      const p = palettes[currentPaletteIdx];
      paletteSwatch.style.background = p.hex;
      paletteSwatch.style.boxShadow = `0 0 6px ${p.hex}`;
      paletteName.textContent = p.name;
    });

    // ============================================================
    // 8. Bucle de Animación
    // ============================================================
    const clock = new THREE.Clock();
    const dataArray = new Uint8Array(32);

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(0.05, clock.getDelta());
      const time = clock.getElapsedTime();

      // Física Spring-Damper
      const targetSquish = isHovered ? 0.88 : 1.0;
      const displacementSpring = squishScaleY - targetSquish;
      const springForce = -springStiffness * displacementSpring - springDamping * squishVelocity;
      squishVelocity += springForce * delta;
      squishScaleY += squishVelocity * delta;
      squishScaleXZ = 1.0 + (1.0 - squishScaleY) * 0.55;

      // Parpadeo
      if (isBlinking) {
        blinkTimer += delta;
        const halfBlink = blinkDuration / 2;
        if (blinkTimer < halfBlink) {
          blinkProgress = 1.0 - (blinkTimer / halfBlink);
        } else if (blinkTimer < blinkDuration) {
          blinkProgress = (blinkTimer - halfBlink) / halfBlink;
        } else {
          blinkProgress = 1.0;
          isBlinking = false;
        }
      }

      if (!isBlinking && Math.random() < 0.003) {
        triggerClickReaction();
      }

      if (clickRippleTime < 1.0) {
        clickRippleTime += delta * 1.6;
      }

      if (morphTransitionProgress < 1.0) {
        morphTransitionProgress += delta * 0.85;
        if (morphTransitionProgress >= 1.0) {
          morphTransitionProgress = 1.0;
          currentSeedHash = targetSeedHash;
          simplexCurrent = simplexTarget;
        }
      }

      currentAmp += (targetAmp - currentAmp) * delta * 2.0;

      if (isMicActive && analyser) {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        audioEnergy = (sum / dataArray.length) / 255;
      } else if (currentMode === "SPEAKING") {
        audioEnergy = (Math.sin(time * 5.0) * 0.35 + 0.45) + (Math.sin(time * 11.0) * 0.15);
      } else if (currentMode === "THINKING") {
        audioEnergy = (Math.sin(time * 7.0) * 0.2 + 0.25);
      } else {
        audioEnergy = 0;
      }

      smoothEyeX += (mouseNormX * 0.42 - smoothEyeX) * (delta * 6.0);
      smoothEyeY += (mouseNormY * 0.38 - smoothEyeY) * (delta * 6.0);

      const posAttr = geometry.attributes.position;
      const origAttr = originalPositions;
      const count = posAttr.count;
      const easeT = morphTransitionProgress * morphTransitionProgress * (3 - 2 * morphTransitionProgress);

      for (let i = 0; i < count; i++) {
        let ox = origAttr.getX(i) * squishScaleXZ;
        let oy = origAttr.getY(i) * squishScaleY;
        let oz = origAttr.getZ(i) * squishScaleXZ;

        const len = Math.sqrt(ox * ox + oy * oy + oz * oz);
        const nx = ox / len;
        const ny = oy / len;
        const nz = oz / len;

        const tCoord = time * 0.6;
        const nA = simplexCurrent.noise3D(ox * baseNoiseFreq + tCoord * 0.3, oy * baseNoiseFreq + tCoord * 0.3, oz * baseNoiseFreq + tCoord * 0.3);
        const nB = simplexTarget.noise3D(ox * baseNoiseFreq + tCoord * 0.3, oy * baseNoiseFreq + tCoord * 0.3, oz * baseNoiseFreq + tCoord * 0.3);
        const blendedNoise = (1.0 - easeT) * nA + easeT * nB;

        let displacement = len + (blendedNoise * currentAmp) + (audioEnergy * 14.0);
        posAttr.setXYZ(i, nx * displacement, ny * displacement, nz * displacement);
      }

      posAttr.needsUpdate = true;
      geometry.computeVertexNormals();

      blobMesh.rotation.y = smoothEyeX * 0.22;
      blobMesh.rotation.x = -smoothEyeY * 0.22;

      renderColoredAscii();
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('seed')) setSeed(urlParams.get('seed'));
    if (urlParams.has('palette')) {
      currentPaletteIdx = parseInt(urlParams.get('palette')) % palettes.length;
      const p = palettes[currentPaletteIdx];
      paletteSwatch.style.background = p.hex;
      paletteSwatch.style.boxShadow = `0 0 6px ${p.hex}`;
      paletteName.textContent = p.name;
    }
    if (urlParams.has('mode')) setVoiceState(urlParams.get('mode').toUpperCase());

    animate();
  </script>
</body>
</html>
