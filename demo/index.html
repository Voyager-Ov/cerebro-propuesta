<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D ASCII Voice Blobatar // Neo-Brutalist Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #000000;
      color: #F4F4F5;
      font-family: 'JetBrains Mono', 'Geist Mono', monospace, Courier;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Aura luminosa trasera */
    #back-aura {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 85, 255, 0.45) 0%, rgba(120, 0, 255, 0.25) 40%, rgba(0, 0, 0, 0) 70%);
      filter: blur(60px);
      pointer-events: none;
      z-index: 1;
      transition: background 0.8s ease, transform 0.2s ease, opacity 0.5s ease;
      opacity: 0.85;
    }

    /* Contenedor del Canvas ASCII */
    #ascii-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      pointer-events: auto;
    }

    #ascii-container pre {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      line-height: 10px;
      font-size: 11px;
      letter-spacing: 2px;
      color: #FFFFFF;
      text-shadow: 0 0 1px rgba(255, 255, 255, 0.8);
      transform-origin: center center;
    }

    /* HUD / Interfaz Superior e Inferior */
    .hud-header {
      position: absolute;
      top: 24px;
      left: 28px;
      right: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: auto;
    }

    .hud-badge {
      font-size: 11px;
      letter-spacing: 2px;
      background: #09090B;
      border: 1px solid #27272A;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #00FF66;
      box-shadow: 0 0 8px #00FF66;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    .hud-footer {
      position: absolute;
      bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 10;
      pointer-events: auto;
      max-width: 680px;
      width: 90%;
    }

    /* Barra de Semilla / Blobatar Input */
    .seed-bar {
      display: flex;
      align-items: center;
      width: 100%;
      background: rgba(13, 13, 14, 0.85);
      border: 1px solid #27272A;
      backdrop-filter: blur(10px);
      padding: 4px;
    }

    .seed-bar span {
      font-size: 11px;
      color: #71717A;
      padding-left: 12px;
      padding-right: 6px;
      letter-spacing: 1px;
    }

    .seed-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #00FF66;
      font-family: inherit;
      font-size: 13px;
      padding: 8px 6px;
      letter-spacing: 1px;
    }

    /* Botones de Control de Estados */
    .controls-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      background: #09090B;
      border: 1px solid #27272A;
      color: #A1A1AA;
      font-family: inherit;
      font-size: 11px;
      padding: 8px 14px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #18181B;
      color: #FFFFFF;
      border-color: #52525B;
    }

    .btn.active {
      background: #FFFFFF;
      color: #000000;
      border-color: #FFFFFF;
      font-weight: 700;
    }

    .btn-mic.active {
      background: #FF0055;
      color: #FFFFFF;
      border-color: #FF0055;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
    }
  </style>
  <!-- Three.js local (offline-ready) -->
  <script src="./three.min.js"></script>
</head>
<body>

  <!-- Aura de Luz Difusa Trasera (Inspiración ChatGPT Voice / Cobalt Blue) -->
  <div id="back-aura"></div>

  <!-- Contenedor del Lienzo ASCII -->
  <div id="ascii-container"></div>

  <!-- HUD Superior -->
  <div class="hud-header">
    <div class="hud-badge">
      <div class="status-dot" id="state-dot"></div>
      <span id="state-label">VOICE_STATE: IDLE // LISTENING_ARMED</span>
    </div>
    <div class="hud-badge">
      <span id="fps-label">FPS: 60 // 3D_BLOB_ASCII</span>
    </div>
  </div>

  <!-- HUD Inferior -->
  <div class="hud-footer">
    <!-- Input para Deterministic Morphing (Estilo Blobatar) -->
    <div class="seed-bar">
      <span>BLOBATAR_SEED:</span>
      <input type="text" id="seed-input" class="seed-input" value="TwinFinance-Avalanche-0x8F" placeholder="Escribe cualquier nombre o prompt para mutar el blob..." />
    </div>

    <!-- Selector de Estados del Voice Chat -->
    <div class="controls-row">
      <button class="btn active" id="btn-idle">IDLE [RESPIRAR]</button>
      <button class="btn btn-mic" id="btn-mic">🎙️ ACTIVAR MICRÓFONO</button>
      <button class="btn" id="btn-think">THINKING [MUTAR SEED]</button>
      <button class="btn" id="btn-speak">SPEAKING [IA HABLANDO]</button>
      <button class="btn" id="btn-palette">PALETA: COBALT BLUE</button>
    </div>
  </div>

  <script>
    // ============================================================
    // 1. Simplex Noise 3D Implementation (Zero Dependencies)
    // ============================================================
    class SimplexNoise {
      constructor(seed = 0) {
        this.p = new Uint8Array(256);
        for (let i = 0; i < 256; i++) this.p[i] = i;
        // Pseudo-random shuffle based on seed
        let s = seed % 2147483647;
        for (let i = 255; i > 0; i--) {
          s = (s * 16807) % 2147483647;
          const j = s % (i + 1);
          const tmp = this.p[i];
          this.p[i] = this.p[j];
          this.p[j] = tmp;
        }
        this.perm = new Uint8Array(512);
        for (let i = 0; i < 512; i++) this.perm[i] = this.p[i & 255];
      }
      noise3D(x, y, z) {
        const F3 = 1.0 / 3.0, G3 = 1.0 / 6.0;
        let s = (x + y + z) * F3;
        let i = Math.floor(x + s), j = Math.floor(y + s), k = Math.floor(z + s);
        let t = (i + j + k) * G3;
        let X0 = i - t, Y0 = j - t, Z0 = k - t;
        let x0 = x - X0, y0 = y - Y0, z0 = z - Z0;
        let i1, j1, k1, i2, j2, k2;
        if (x0 >= y0) {
          if (y0 >= z0) { i1=1; j1=0; k1=0; i2=1; j2=1; k2=0; }
          else if (x0 >= z0) { i1=1; j1=0; k1=0; i2=1; j2=0; k2=1; }
          else { i1=0; j1=0; k1=1; i2=1; j2=0; k2=1; }
        } else {
          if (y0 < z0) { i1=0; j1=0; k1=1; i2=0; j2=1; k2=1; }
          else if (x0 < z0) { i1=0; j1=1; k1=0; i2=0; j2=1; k2=1; }
          else { i1=0; j1=1; k1=0; i2=1; j2=1; k2=0; }
        }
        let x1 = x0 - i1 + G3, y1 = y0 - j1 + G3, z1 = z0 - k1 + G3;
        let x2 = x0 - i2 + 2.0*G3, y2 = y0 - j2 + 2.0*G3, z2 = z0 - k2 + 2.0*G3;
        let x3 = x0 - 1.0 + 3.0*G3, y3 = y0 - 1.0 + 3.0*G3, z3 = z0 - 1.0 + 3.0*G3;
        let ii = i & 255, jj = j & 255, kk = k & 255;
        let n0 = 0, n1 = 0, n2 = 0, n3 = 0;
        let t0 = 0.6 - x0*x0 - y0*y0 - z0*z0;
        if (t0 > 0) { t0 *= t0; n0 = t0 * t0 * this.grad(this.perm[ii + this.perm[jj + this.perm[kk]]], x0, y0, z0); }
        let t1 = 0.6 - x1*x1 - y1*y1 - z1*z1;
        if (t1 > 0) { t1 *= t1; n1 = t1 * t1 * this.grad(this.perm[ii + i1 + this.perm[jj + j1 + this.perm[kk + k1]]], x1, y1, z1); }
        let t2 = 0.6 - x2*x2 - y2*y2 - z2*z2;
        if (t2 > 0) { t2 *= t2; n2 = t2 * t2 * this.grad(this.perm[ii + i2 + this.perm[jj + j2 + this.perm[kk + k2]]], x2, y2, z2); }
        let t3 = 0.6 - x3*x3 - y3*y3 - z3*z3;
        if (t3 > 0) { t3 *= t3; n3 = t3 * t3 * this.grad(this.perm[ii + 1 + this.perm[jj + 1 + this.perm[kk + 1]]], x3, y3, z3); }
        return 32.0 * (n0 + n1 + n2 + n3);
      }
      grad(hash, x, y, z) {
        let h = hash & 15;
        let u = h < 8 ? x : y;
        let v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
        return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
      }
    }

    // ============================================================
    // 2. Three.js Scene Setup & Geometry
    // ============================================================
    const container = document.getElementById('ascii-container');
    const aura = document.getElementById('back-aura');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
    camera.position.z = 240;

    // Crear Icosahedro de alta densidad para la deformación orgánica del blob
    const baseRadius = 60;
    const geometry = new THREE.IcosahedronGeometry(baseRadius, 5);
    const originalPositions = geometry.attributes.position.clone();

    // Material sombreado estándar para capturar luces y sombras
    const material = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.2,
      metalness: 0.1,
      flatShading: false
    });

    const blobMesh = new THREE.Mesh(geometry, material);
    scene.add(blobMesh);

    // Luces
    const ambientLight = new THREE.AmbientLight(0x333333);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight1.position.set(100, 100, 150);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x0088ff, 0.8);
    dirLight2.position.set(-100, -80, -50);
    scene.add(dirLight2);

    // Offscreen Canvas Renderer para el pase de luminancia
    const renderWidth = 130;  // Resolución horizontal en caracteres
    const renderHeight = 65;  // Resolución vertical en caracteres
    const offRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    offRenderer.setSize(renderWidth, renderHeight);

    // Elemento <pre> donde se proyecta el texto ASCII
    const preElement = document.createElement('pre');
    container.appendChild(preElement);

    // ============================================================
    // 3. ASCII Shader / Conversion Pipeline (Luminance Mapping)
    // ============================================================
    // Rampa de caracteres de menor a mayor densidad luminosa
    const asciiChars = "  .:-=+*#%@";
    const charCount = asciiChars.length;
    const pixelBuffer = new Uint8Array(renderWidth * renderHeight * 4);

    function renderAscii() {
      offRenderer.render(scene, camera);
      const gl = offRenderer.getContext();
      gl.readPixels(0, 0, renderWidth, renderHeight, gl.RGBA, gl.UNSIGNED_BYTE, pixelBuffer);

      let asciiStr = "";
      for (let y = renderHeight - 1; y >= 0; y--) {
        for (let x = 0; x < renderWidth; x++) {
          const idx = (y * renderWidth + x) * 4;
          const r = pixelBuffer[idx];
          const g = pixelBuffer[idx + 1];
          const b = pixelBuffer[idx + 2];
          const a = pixelBuffer[idx + 3];

          if (a < 20) {
            asciiStr += " ";
          } else {
            // Cálculo de luminosidad perceptual
            const brightness = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            const charIdx = Math.floor(brightness * (charCount - 1));
            asciiStr += asciiChars[charIdx] || " ";
          }
        }
        asciiStr += "\n";
      }
      preElement.textContent = asciiStr;
    }

    // ============================================================
    // 4. Deterministic Seed & Blobatar Hash
    // ============================================================
    function hashStringToSeed(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash);
    }

    let simplex = new SimplexNoise(hashStringToSeed("TwinFinance-Avalanche-0x8F"));
    let noiseFrequency = 0.035;
    let noiseAmplitude = 16.0;
    let morphSpeed = 0.8;

    document.getElementById('seed-input').addEventListener('input', (e) => {
      const val = e.target.value.trim() || "default";
      simplex = new SimplexNoise(hashStringToSeed(val));
      triggerAuraReaction();
    });

    // ============================================================
    // 5. Web Audio API & Mic Detection (Voice Mode)
    // ============================================================
    let audioContext = null;
    let analyser = null;
    let micStream = null;
    let isMicActive = false;
    let audioVolume = 0;
    let audioFrequency = 0;

    const btnMic = document.getElementById('btn-mic');

    async function toggleMicrophone() {
      if (isMicActive) {
        if (micStream) micStream.getTracks().forEach(t => t.stop());
        isMicActive = false;
        btnMic.classList.remove('active');
        btnMic.textContent = "🎙️ ACTIVAR MICRÓFONO";
        setVoiceState("IDLE");
      } else {
        try {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const source = audioContext.createMediaStreamSource(micStream);
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 64;
          source.connect(analyser);

          isMicActive = true;
          btnMic.classList.add('active');
          btnMic.textContent = "🔴 MIC EN VIVO (HABLA AHORA)";
          setVoiceState("LISTENING");
        } catch (err) {
          alert("No se pudo acceder al micrófono. Se activará el simulador procedural de voz.");
          isMicActive = false;
        }
      }
    }
    btnMic.addEventListener('click', toggleMicrophone);

    // ============================================================
    // 6. Voice Modes & Palettes
    // ============================================================
    let currentMode = "IDLE"; // IDLE, LISTENING, THINKING, SPEAKING
    const stateLabel = document.getElementById('state-label');
    const stateDot = document.getElementById('state-dot');

    const palettes = [
      { name: "COBALT BLUE", aura: "radial-gradient(circle, rgba(0, 85, 255, 0.5) 0%, rgba(120, 0, 255, 0.25) 45%, rgba(0, 0, 0, 0) 70%)", charColor: "#FFFFFF" },
      { name: "CYBER CYAN", aura: "radial-gradient(circle, rgba(0, 240, 255, 0.5) 0%, rgba(0, 85, 255, 0.25) 45%, rgba(0, 0, 0, 0) 70%)", charColor: "#E0F7FA" },
      { name: "EMERALD MINT", aura: "radial-gradient(circle, rgba(0, 255, 128, 0.5) 0%, rgba(0, 100, 255, 0.25) 45%, rgba(0, 0, 0, 0) 70%)", charColor: "#E8F5E9" },
      { name: "SOLAR AMBER", aura: "radial-gradient(circle, rgba(255, 120, 0, 0.55) 0%, rgba(255, 0, 80, 0.25) 45%, rgba(0, 0, 0, 0) 70%)", charColor: "#FFF8E1" }
    ];
    let currentPaletteIdx = 0;

    function setVoiceState(mode) {
      currentMode = mode;
      document.querySelectorAll('.controls-row .btn:not(#btn-palette):not(#btn-mic)').forEach(b => b.classList.remove('active'));

      if (mode === "IDLE") {
        document.getElementById('btn-idle').classList.add('active');
        stateLabel.textContent = "VOICE_STATE: IDLE // RESPIRACIÓN";
        stateDot.style.backgroundColor = "#00FF66";
        stateDot.style.boxShadow = "0 0 8px #00FF66";
        noiseAmplitude = 14.0;
        morphSpeed = 0.6;
        aura.style.background = palettes[currentPaletteIdx].aura;
      } else if (mode === "LISTENING") {
        stateLabel.textContent = "VOICE_STATE: LISTENING // CAPTURANDO VOZ";
        stateDot.style.backgroundColor = "#0088FF";
        stateDot.style.boxShadow = "0 0 10px #0088FF";
        noiseAmplitude = 22.0;
        morphSpeed = 1.2;
      } else if (mode === "THINKING") {
        document.getElementById('btn-think').classList.add('active');
        stateLabel.textContent = "VOICE_STATE: THINKING // MUTANDO SEED";
        stateDot.style.backgroundColor = "#B000FF";
        stateDot.style.boxShadow = "0 0 10px #B000FF";
        noiseAmplitude = 30.0;
        morphSpeed = 2.4;
        aura.style.background = "radial-gradient(circle, rgba(176, 0, 255, 0.55) 0%, rgba(0, 120, 255, 0.3) 45%, rgba(0, 0, 0, 0) 70%)";
      } else if (mode === "SPEAKING") {
        document.getElementById('btn-speak').classList.add('active');
        stateLabel.textContent = "VOICE_STATE: SPEAKING // IA RESPONDIENDO";
        stateDot.style.backgroundColor = "#00F0FF";
        stateDot.style.boxShadow = "0 0 10px #00F0FF";
        noiseAmplitude = 26.0;
        morphSpeed = 1.6;
        aura.style.background = "radial-gradient(circle, rgba(0, 240, 255, 0.55) 0%, rgba(0, 255, 100, 0.25) 45%, rgba(0, 0, 0, 0) 70%)";
      }
    }

    document.getElementById('btn-idle').addEventListener('click', () => setVoiceState("IDLE"));
    document.getElementById('btn-think').addEventListener('click', () => setVoiceState("THINKING"));
    document.getElementById('btn-speak').addEventListener('click', () => setVoiceState("SPEAKING"));

    document.getElementById('btn-palette').addEventListener('click', () => {
      currentPaletteIdx = (currentPaletteIdx + 1) % palettes.length;
      aura.style.background = palettes[currentPaletteIdx].aura;
      preElement.style.color = palettes[currentPaletteIdx].charColor;
      document.getElementById('btn-palette').textContent = "PALETA: " + palettes[currentPaletteIdx].name;
    });

    function triggerAuraReaction() {
      aura.style.transform = "translate(-50%, -50%) scale(1.15)";
      setTimeout(() => {
        aura.style.transform = "translate(-50%, -50%) scale(1.0)";
      }, 250);
    }

    // ============================================================
    // 7. Interactive Mouse / Wake Effect Tracking (Bencho Style)
    // ============================================================
    let mouseX = 0, mouseY = 0;
    let targetRotX = 0, targetRotY = 0;

    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
      targetRotY = mouseX * 0.45;
      targetRotX = -mouseY * 0.45;
    });

    // ============================================================
    // 8. Main Animation & Deformation Loop
    // ============================================================
    let clock = new THREE.Clock();
    const dataArray = new Uint8Array(32);

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      // Analizar micrófono si está activo
      if (isMicActive && analyser) {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        audioVolume = sum / dataArray.length; // 0 a 255
      } else if (currentMode === "SPEAKING") {
        // Simulación rítmica armónica
        audioVolume = 40 + Math.sin(time * 6) * 35 + Math.sin(time * 12) * 15;
      } else if (currentMode === "THINKING") {
        audioVolume = 25 + Math.sin(time * 8) * 20;
      } else {
        audioVolume = 0;
      }

      // Modulación de escala y deformación según la voz
      const voiceBoost = (audioVolume / 255) * 35.0;
      const currentAmp = noiseAmplitude + voiceBoost;
      const effectiveSpeed = time * morphSpeed;

      // Deformar vértices con Simplex Noise (Blobatar 3D Engine)
      const posAttr = geometry.attributes.position;
      const origAttr = originalPositions;
      const count = posAttr.count;

      for (let i = 0; i < count; i++) {
        const ox = origAttr.getX(i);
        const oy = origAttr.getY(i);
        const oz = origAttr.getZ(i);

        // Vector normal esférico normalizado
        const len = Math.sqrt(ox * ox + oy * oy + oz * oz);
        const nx = ox / len;
        const ny = oy / len;
        const nz = oz / len;

        // Ruido tridimensional con armónico de audio
        const noiseVal = simplex.noise3D(
          ox * noiseFrequency + effectiveSpeed * 0.4,
          oy * noiseFrequency + effectiveSpeed * 0.4,
          oz * noiseFrequency + effectiveSpeed * 0.4
        );

        // Modulación radial
        const displacement = len + (noiseVal * currentAmp) + (voiceBoost * 0.4);
        posAttr.setXYZ(i, nx * displacement, ny * displacement, nz * displacement);
      }
      posAttr.needsUpdate = true;
      geometry.computeVertexNormals();

      // Suavizado de rotación con seguimiento del mouse
      blobMesh.rotation.y += (targetRotY - blobMesh.rotation.y) * 0.08 + 0.005;
      blobMesh.rotation.x += (targetRotX - blobMesh.rotation.x) * 0.08;

      // Renderizar a caracteres ASCII
      renderAscii();
    }

    // Leer parámetros de la URL para testing y screenshots automatizados
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('seed')) {
      const s = urlParams.get('seed');
      document.getElementById('seed-input').value = s;
      simplex = new SimplexNoise(hashStringToSeed(s));
    }
    if (urlParams.has('palette')) {
      currentPaletteIdx = parseInt(urlParams.get('palette')) % palettes.length;
      aura.style.background = palettes[currentPaletteIdx].aura;
      preElement.style.color = palettes[currentPaletteIdx].charColor;
      document.getElementById('btn-palette').textContent = "PALETA: " + palettes[currentPaletteIdx].name;
    }
    if (urlParams.has('mode')) {
      setVoiceState(urlParams.get('mode').toUpperCase());
    }

    animate();

    // ============================================================
    // 9. Window Resize Handler
    // ============================================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });
  </script>
</body>
</html>
